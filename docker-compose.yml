# Local development stack: PostgreSQL 17 + pgvector and Redis; the role bootstrap runs
# on first start. Then the app can run migrations and serve.
#
#   docker compose up -d db redis
#   # then, from the host (with the venv active):
#   alembic upgrade head
#   uvicorn app.main:app --reload --port 8000
#
# Point the frontend at this backend:
#   NEXT_PUBLIC_API_ADAPTER=http
#   NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
#   (and run the backend with LUCIEL_COOKIE_SECURE=false for http localhost)

services:
  db:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: luciel_dev
    ports:
      - "5432:5432"
    volumes:
      - luciel_pgdata:/var/lib/postgresql/data
      # Bootstrap roles + per-db setup run on first init (alphabetical order).
      - ./scripts/docker/00_bootstrap_roles.sql:/docker-entrypoint-initdb.d/00_bootstrap_roles.sql:ro
      - ./scripts/docker/10_bootstrap_db.sql:/docker-entrypoint-initdb.d/10_bootstrap_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d luciel_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  luciel_pgdata:
