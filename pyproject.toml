[build-system]
# Explicit build config so the package builds deterministically everywhere
# (Docker/CI/local). Without this, setuptools auto-discovery fails on the
# multi-top-level-dir layout: "Multiple top-level packages discovered".
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[project]
name = "luciel-backend"
version = "0.1.0"
description = "VantageMind Luciel server platform — backend"
requires-python = ">=3.12"
dependencies = [
    # Pinned: fastapi >=0.138,<0.142 + starlette >=1.3.1,<1.8 — patches 8 starlette
    # CVEs flagged by pip-audit (the 0.41.3 cluster: PYSEC-2026-161/248/249,
    # CVE-2025-54121, CVE-2025-62727, CVE-2026-48817/48818, all fixed by <=1.3.1).
    # A prior bump to fastapi 0.137.x + starlette 1.3 silently dropped include_router
    # routes; 0.138 registers them correctly. tests/unit/test_route_registry.py now
    # asserts the full registered path+method set so that regression can never recur.
    "fastapi>=0.138,<0.142",
    "starlette>=1.3.1,<1.10",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # psycopg (v3) drives Alembic's sync URL and scripts/run_sql.py; the `email` extra
    # (email-validator) backs every EmailStr field. Both were installed ad hoc by the
    # Dockerfile and CI (`uv pip install ... "psycopg[binary]" "pydantic[email]"`) and
    # so floated outside any lock; declared here, uv.lock pins them like the rest
    # (round 7 WP-9).
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "redis>=5.2",
    "pgvector>=0.3.6",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "stripe>=11.4",
    # Live LLM cutover (gated behind LUCIEL_INTEGRATION_MODE=live). Imported lazily
    # in app/runtime/providers.py and app/connections/secrets.py so mock-mode/CI
    # never touches them at runtime, but they ship in the image for the flip.
    "anthropic>=0.40",
    "openai>=1.55",
    "boto3>=1.35",
    # SMS/Voice transport (Architecture §3.1.4 BYO-number). Runtime dependency, not
    # optional: the tenant send path, credential verification and the number
    # operability probe all construct `twilio.rest.Client`. Those imports are lazy and
    # ImportError-guarded, so a missing package degrades SILENTLY — an unverifiable
    # number reported as `not_operable_hosting_required` — rather than crashing. Major
    # 9 is the line the `Client(sid, token)` / `Client(key_sid, key_secret, account_sid)`
    # constructors and the `incoming_phone_numbers` / `api.accounts()` resources match.
    "twilio>=9.0,<10",
    # SNS message signature verification for inbound SES email (P0-7). X.509 certificate
    # parsing + RSA PKCS#1 v1.5 verification against the AWS-hosted signing cert; the
    # stdlib offers neither. Imported lazily inside app/channels/sns_verification.py so
    # mock mode never loads it.
    "cryptography>=44",
    # own_domain email routing reverify (harmony fix 2026-08-04 item 5 / §3.1.6a):
    # live MX-delegation check against the tenant-supplied domain, mirroring the SMS
    # operability probe's honesty posture. Already present transitively via
    # email-validator; pinned directly here since app/channels/email_routing.py
    # imports it at the top level of a lazy-imported module and a resolver change
    # dropping the transitive pin must not silently break this probe.
    "dnspython>=2.6,<3",
    # Knowledge file parsers (Architecture §3.2.3 / §3.2 ingestion pipeline): PDF and
    # DOCX text extraction for the upload path. Pure-Python, no native deps, so the
    # image build stays simple; CSV/TXT need no extra library (stdlib csv + decode).
    "pypdf>=5.1",
    "python-docx>=1.1",
]

[project.optional-dependencies]
# Locked like the runtime set (uv.lock): CI runs `uv sync --frozen --extra dev`, the
# image `uv sync --frozen --no-dev` (no extras). A range below is what the lock MAY
# resolve to; the lock is what actually installs. Dependabot (package-ecosystem uv)
# moves the lock, and the monthly dependency-review issue lists range drift.
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    # The three CI gate tools are PINNED exactly: CI installs from this table at run
    # time, so an unpinned floor makes the gate drift red on upstream releases with
    # zero repo changes (live-caught twice: 2026-08-18 `86b83f3`, and again on the
    # 2026-08-19 run for 9ed4f2c). Bump deliberately: upgrade the pin, reformat, and
    # fix findings in the same commit.
    "ruff==0.17.1",
    "mypy==2.4.0",
    "bandit==1.9.4",
    "pip-audit>=2.7",
    "detect-secrets>=1.5",
    "types-redis",
    # Hermetic test doubles for the live cutover: fakeredis for the Redis cap store,
    # botocore Stubber (ships with boto3) for SecretsManagerStore. No AWS, no Redis.
    "fakeredis>=2.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
# S101 assert-in-tests; B008 is the FastAPI Depends() idiom; UP042 conflicts with
# the (str, Enum) pattern SQLAlchemy maps cleanly; ASYNC109 — webhook executor
# signatures intentionally carry a `timeout` param (the 10s envelope, §3.8.6).
ignore = ["S101", "B008", "UP042", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"app/migrations/**" = ["E501", "F401"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["app/migrations/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# A test that runs this long gets every thread stack dumped to stderr (pytest built-in);
# tests/conftest.py adds the watchdog that then fails the run with the asyncio tasks
# and database sessions, instead of letting CI cancel a silent job after 35 minutes.
faulthandler_timeout = 300
testpaths = ["tests"]
filterwarnings = [
    # Benign Pydantic false-positive from `type X = Literal[...]` aliases interacting
    # with the model alias_generator; camelCase serialization is verified correct.
    "ignore::pydantic.PydanticDeprecatedSince20",
    "ignore:.*alias.*attribute with value.*:UserWarning",
]
markers = [
    "isolation: tenant-isolation suite (non-overridable in CI)",
    "contract: frontend wire-contract conformance",
]

[tool.bandit]
exclude_dirs = ["tests", "app/migrations"]
