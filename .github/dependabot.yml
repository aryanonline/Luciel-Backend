# Dependency upkeep without a person in the loop (round 6 WP-B, owner request
# 2026-09-07: "automatically perform any Next migrations or CVE reviews without
# having me and my team manage it").
#
# Every ecosystem this repository ships targets the RELEASE branch, `main` (the
# default branch). Minor and patch updates are grouped into one weekly
# PR per ecosystem; `.github/workflows/dependabot-auto-merge.yml` squash-merges a
# grouped or single minor/patch PR once CI is green and labels a MAJOR bump for a
# person.
#
# This file configures VERSION updates only. Dependabot alerts and security updates are
# repository settings this file cannot turn on; whether they run is the owner's call in
# Settings > Code security (both read off here on 2026-11-01). Until then a new advisory
# reaches this repo through ci.yml's daily pip-audit and the monthly dependency-review.
#
# Python is the `uv` ecosystem, not `pip` (round 7 WP-9): the backend installs from
# uv.lock (CI `uv sync --frozen --extra dev`, the image `uv sync --frozen --no-dev`),
# and Dependabot's `uv` updater edits pyproject.toml AND re-locks uv.lock in the same
# PR, so the lock CI tests is the lock the image installs. The `pip` updater does not
# maintain uv.lock: it would bump pyproject ranges and leave the lock stale (CI's
# `uv lock --check` then fails the PR), and it never moves a locked version that is
# already inside its range. PR titles keep the same shapes ("Bump X from A to B",
# "Update X requirement from S to T", the grouped "minor-and-patch group") that
# dependabot-auto-merge.yml classifies — but the GROUP's content changed: the uv
# updater folds a pyproject range widening into the weekly group PR, where the
# classifier honours the group title without its 0.x-is-major rule. A deliberate
# 0.x ceiling (fastapi, pyproject.toml) is therefore kept OUT of the group so its
# bumps arrive standalone, classified by the 0.x rule and labelled for a person
# (Phase 3 review, 2026-10-19; the 2026-09-28 note in dependabot-auto-merge.yml).
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Toronto
    open-pull-requests-limit: 5
    labels: [dependencies, python]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
        # fastapi's 0.x ceiling is a person's call (see the header comment).
        exclude-patterns: [fastapi]

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Toronto
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Toronto
    open-pull-requests-limit: 2
    labels: [dependencies, docker]
    # The Python runtime line is a deliberate choice (pyproject requires-python, CI,
    # native wheels): a base-image major/minor bump is not a dependency update to
    # auto-merge (2026-09-07: 3.12 → 3.14 slipped through as "minor"). Patch-level
    # image rebuilds still arrive.
    ignore:
      - dependency-name: python
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: npm
    directory: /infra
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Toronto
    open-pull-requests-limit: 5
    labels: [dependencies, infra]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
