# Dependency upkeep without a person in the loop (round 6 WP-B, owner request
# 2026-09-07: "automatically perform any Next migrations or CVE reviews without
# having me and my team manage it").
#
# Every ecosystem this repository ships targets the RELEASE branch (the stale
# `main` is never touched). Minor and patch updates are grouped into one weekly
# PR per ecosystem; `.github/workflows/dependabot-auto-merge.yml` squash-merges a
# grouped or single minor/patch PR once CI is green and labels a MAJOR bump for a
# person. Security updates arrive as soon as the advisory does, on the same rules.
#
# Python is the `uv` ecosystem, not `pip` (round 7 WP-9): the backend installs from
# uv.lock (CI `uv sync --frozen --extra dev`, the image `uv sync --frozen --no-dev`),
# and Dependabot's `uv` updater edits pyproject.toml AND re-locks uv.lock in the same
# PR, so the lock CI tests is the lock the image installs. The `pip` updater does not
# maintain uv.lock: it would bump pyproject ranges and leave the lock stale (CI's
# `uv lock --check` then fails the PR), and it never moves a locked version that is
# already inside its range. PR titles keep the
# same shapes ("Bump X from A to B", "Update X requirement from S to T", the grouped
# "minor-and-patch group") that dependabot-auto-merge.yml classifies.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: feat/docs-conformance-build-20260713-r2
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Toronto
    open-pull-requests-limit: 5
    labels: [dependencies, python]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: feat/docs-conformance-build-20260713-r2
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Toronto
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    target-branch: feat/docs-conformance-build-20260713-r2
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Toronto
    open-pull-requests-limit: 2
    labels: [dependencies, docker]
    # The Python runtime line is a deliberate choice (pyproject requires-python, CI,
    # native wheels): a base-image major/minor bump is not a dependency update to
    # auto-merge (2026-09-07: 3.12 → 3.14 slipped through as "minor"). Patch-level
    # image rebuilds still arrive.
    ignore:
      - dependency-name: python
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: npm
    directory: /infra
    target-branch: feat/docs-conformance-build-20260713-r2
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Toronto
    open-pull-requests-limit: 5
    labels: [dependencies, infra]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
