name: image-rebuild

# Weekly base-image refresh + scan, WITHOUT a deploy (round 7 WP-9).
#
# Every CVE waiver in .security/cve-allowlist.json says the same thing: "the
# build-time apt-get upgrade adopts the fix on the first rebuild after Debian ships
# it". Before this workflow nothing rebuilt the image on a schedule, so a Debian fix
# reached the running service only when somebody happened to dispatch a deploy.
# This job rebuilds the image from the release branch every Monday, pushes it under
# a `weekly-<date>` tag (the repo's lifecycle policy expires it), waits for the ECR
# scan, runs the SAME governed gate the deploy uses in REPORT mode, and posts the
# outcome — remaining CRITICAL/HIGH findings and waivers that no longer match — on
# the month's "Dependency & CVE review" issue. The monthly steward reads that comment
# to retire or renew waivers with evidence. It never deploys and never touches a
# running service.

on:
  schedule:
    - cron: '30 7 * * 1'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  issues: write

concurrency:
  group: image-rebuild
  cancel-in-progress: false

env:
  AWS_REGION: ca-central-1
  ACCOUNT: '729005488042'
  RELEASE_BRANCH: ${{ vars.RELEASE_BRANCH || 'feat/docs-conformance-build-20260713-r2' }}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_BRANCH }}

      - name: Configure AWS via OIDC (dev deploy role — dev ECR is the scratch registry)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT }}:role/luciel-dev-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build + push the weekly image (no deploy)
        id: build
        env:
          ECR: ${{ steps.ecr.outputs.registry }}
          REPO: luciel-backend-dev
        run: |
          set -euo pipefail
          TAG="weekly-$(date -u +%Y%m%d)"
          docker build --pull -t "$ECR/$REPO:$TAG" .
          docker push "$ECR/$REPO:$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Wait for the ECR scan and run the gate in report mode
        id: gate
        continue-on-error: true
        env:
          REPO: luciel-backend-dev
          TAG: ${{ steps.build.outputs.tag }}
        run: |
          set -euo pipefail
          aws ecr wait image-scan-complete --repository-name "$REPO" --image-id imageTag="$TAG"
          aws ecr describe-image-scan-findings --repository-name "$REPO" \
            --image-id imageTag="$TAG" --max-results 1000 --output json > scan-findings.json
          python3 scripts/check_image_scan.py scan-findings.json .security/cve-allowlist.json 2>&1 | tee gate.txt

      - name: Post the outcome on the month's review issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          TAG: ${{ steps.build.outputs.tag }}
        run: |
          set -euo pipefail
          month=$(date -u +%Y-%m)
          title="Dependency & CVE review $month"
          {
            echo "### Weekly image rebuild — \`$TAG\` — gate **$GATE_OUTCOME**"
            echo
            echo "Fresh build of the release branch, scanned by ECR (run ${{ github.run_id }}). Not deployed."
            echo
            echo '```'; cat gate.txt 2>/dev/null || echo "(no gate output)"; echo '```'
            echo
            echo "Lines reading \`no longer matches any finding\` are waivers to RETIRE; \`not allowlisted\` lines are new findings a person (or the monthly steward) must review."
          } > comment.md
          existing=$(gh issue list --repo "$REPO" --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --repo "$REPO" --body-file comment.md
          else
            gh issue create --repo "$REPO" --title "$title" --label dependencies --body-file comment.md
          fi
