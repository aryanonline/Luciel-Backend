name: image-rebuild

# Weekly base-image refresh + scan, WITHOUT a deploy (round 7 WP-9).
#
# Every CVE waiver in .security/cve-allowlist.json says the same thing: "the
# build-time apt-get upgrade adopts the fix on the first rebuild after Debian ships
# it". Before this workflow nothing rebuilt the image on a schedule, so a Debian fix
# reached the running service only when somebody happened to dispatch a deploy.
# This job rebuilds the image from the release branch every Monday, pushes it under
# a `weekly-<date>` tag (the repo's lifecycle policy expires it), waits for the ECR
# scan, runs the SAME governed gate the deploy uses in REPORT mode, and posts the
# outcome — remaining CRITICAL/HIGH findings and waivers that no longer match, plus
# the Debian tracker status of every waived and every new CVE — on the month's
# "Dependency & CVE review YYYY-MM" issue (scripts/post_review_issue.sh, the one title
# ci.yml and dependency-review.yml post to as well). The monthly steward reads that
# comment to retire or renew waivers with evidence. It never deploys and never
# touches a running service.

on:
  schedule:
    - cron: '30 7 * * 1'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  issues: write

concurrency:
  group: image-rebuild
  cancel-in-progress: false

env:
  AWS_REGION: ca-central-1
  ACCOUNT: '729005488042'
  RELEASE_BRANCH: ${{ vars.RELEASE_BRANCH || 'feat/docs-conformance-build-20260713-r2' }}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_BRANCH }}

      - name: Configure AWS via OIDC (dev deploy role — dev ECR is the scratch registry)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT }}:role/luciel-dev-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # buildx + QEMU: the weekly image is built the way the deploy builds it —
      # multi-arch, so its scan reports on the arm64 child the ARM64 tasks run
      # (round 7 WP-8, D7 Graviton).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build + push the weekly image (no deploy)
        id: build
        env:
          ECR: ${{ steps.ecr.outputs.registry }}
          REPO: luciel-backend-dev
        run: |
          set -euo pipefail
          TAG="weekly-$(date -u +%Y%m%d)"
          docker buildx build --pull --platform linux/amd64,linux/arm64 \
            --provenance=false --sbom=false \
            -t "$ECR/$REPO:$TAG" --push .
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Wait for the ECR scan and run the gate in report mode
        id: gate
        continue-on-error: true
        env:
          REPO: luciel-backend-dev
          TAG: ${{ steps.build.outputs.tag }}
        run: |
          set -euo pipefail
          # The same multi-arch gate the deploy runs (scripts/gate_image_scan.sh):
          # resolves the tag's platform children, waits for each child's scan-on-push
          # to complete (the ECR waiter errors on ScanNotFound instead of retrying —
          # round 7: that raced the very first run of this gate), and runs the governed
          # check on each. Report mode here: the step's outcome is posted below.
          bash scripts/gate_image_scan.sh "$REPO" "$TAG" 2>&1 | tee gate.txt

      # Tracker evidence for the steward (round 7 WP-9): the monthly cloud routine
      # cannot reach security-tracker.debian.org (egress-blocked in its sandbox) and
      # was renewing waivers on search-engine evidence; this runner can. Every waived
      # CVE and every CVE the gate just reported as `not allowlisted` is looked up;
      # an unreachable tracker reads `tracker unreachable` and never fails the job.
      - name: Debian tracker status for every waived and every new finding
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          python3 scripts/debian_tracker_status.py \
            --allowlist .security/cve-allowlist.json --gate-output gate.txt \
            --markdown tracker.md

      - name: Post the outcome on the month's review issue
        if: always() && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          TAG: ${{ steps.build.outputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "### Weekly image rebuild — \`$TAG\` — gate **$GATE_OUTCOME**"
            echo
            echo "Fresh build of the release branch, scanned by ECR (run ${{ github.run_id }}). Not deployed."
            echo
            echo '```'; cat gate.txt 2>/dev/null || echo "(no gate output)"; echo '```'
            echo
            echo "Lines reading \`no longer matches any finding\` are waivers to RETIRE; \`not allowlisted\` lines are new findings a person (or the monthly steward) must review — each names the package and installed version to look up. Findings move between weekly rebuilds: write a waiver against the scan of the image about to ship, never against last week's report."
            echo
            cat tracker.md 2>/dev/null || echo "(Debian tracker status not gathered)"
          } > comment.md
          bash scripts/post_review_issue.sh comment.md
