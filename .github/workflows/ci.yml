name: CI

# Non-overridable quality gate (Architecture §5.14/§5.15, Space Instructions §8):
# isolation suite + unit + integration + contract + migration apply/rollback +
# ruff + mypy + bandit (SAST) + pip-audit (deps) + detect-secrets + doctrine sync.
# The tenant-isolation suite failing blocks the merge — there is no override.

on:
  pull_request:
  push:
    # The release branch, not the stale `main` (2026-09-07: it is also the default
    # branch now, so the daily schedule below audits the code that actually ships).
    branches: [feat/docs-conformance-build-20260713-r2]
  # 2026-09-05 audit F039: pip-audit, bandit and the secret scan run daily, not
  # only when someone pushes — a CVE published on a quiet week still blocks.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch: {}

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    # A normal run is ~12 minutes. Without a ceiling a hung test holds the runner for
    # GitHub's 6-hour default and reports nothing (round 7, 2026-10-04).
    timeout-minutes: 35

    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      PGPASSWORD: postgres
      LUCIEL_COOKIE_SECURE: "false"
      # uv sync builds .venv on the 3.12 line the image runs (python:3.12.x-slim).
      UV_PYTHON: '3.12'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Pinned (round 7 WP-9): uv.lock was written by this version and the
          # Dockerfile copies the same one (ghcr.io/astral-sh/uv:<version>). Bump the
          # three together — ci.yml, dependency-review.yml, Dockerfile.
          version: '0.12.23'

      - name: Set up Python
        run: uv python install 3.12

      - name: Install deps (the LOCKED set — uv.lock)
        run: |
          # The lock must match pyproject.toml: a range edited without re-locking
          # fails HERE, not as a silently different install (`uv lock --check`
          # re-resolves and refuses to write).
          uv lock --check
          # --frozen: install exactly uv.lock, never re-resolve. The image installs
          # the same lock (`uv sync --frozen --no-dev`), so what this run tests is
          # what the deploy ships (before the lock, both floated within the ranges).
          uv sync --frozen --extra dev

      - name: Provision DB roles (the non-superuser app role + narrow auth role + audit owner)
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/bootstrap_roles.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE luciel_app PASSWORD 'luciel_dev_pw';"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE luciel_dev OWNER luciel_app;"
          psql -h localhost -U postgres -d luciel_dev -v ON_ERROR_STOP=1 -f scripts/bootstrap_db.sql

      - name: Lint (ruff)
        run: |
          . .venv/bin/activate
          ruff check app tests
          ruff format --check app tests

      - name: Type-check (mypy strict)
        run: |
          . .venv/bin/activate
          mypy app

      - name: SAST (bandit)
        run: |
          . .venv/bin/activate
          bandit -q -r app -c pyproject.toml

      - name: Dependency audit (pip-audit — blocks on a fixable vulnerability)
        run: |
          . .venv/bin/activate
          # Architecture §5.14 / Commitment §27: a dependency CVE with a fix available
          # must BLOCK the build (images failing on a high/critical CVE do not promote).
          # --strict makes pip-audit exit non-zero on any vulnerability with a known fix;
          # this is no longer advisory (was `|| true`, audit finding Axis11-F03).
          #
          # We audit a frozen requirements set rather than the live environment so the
          # editable-installed project itself (`luciel-backend`, unpublished) is never in
          # the audit set. `--skip-editable` alone is incompatible with `--strict` (strict
          # treats the skipped editable dist as a collection failure and exits 1). The
          # export omits editable installs, so every real third-party dependency is still
          # audited strictly and a fixable CVE still BLOCKS the build (Arch §5.14 / C27).
          uv pip freeze --exclude-editable > /tmp/audit-reqs.txt
          pip-audit --strict --desc -r /tmp/audit-reqs.txt

      - name: Secret scan (detect-secrets)
        run: |
          . .venv/bin/activate
          detect-secrets scan --baseline .secrets.baseline || \
            (echo "New secrets detected — review .secrets.baseline" && exit 1)

      - name: Doctrine-to-code sync (Architecture §5.9.3)
        run: |
          . .venv/bin/activate
          python scripts/check_doctrine_sync.py --diff-base "${{ github.event.pull_request.base.sha || 'HEAD~1' }}"

      - name: Migration apply + rollback (expand-contract, §5.9.1)
        env:
          LUCIEL_DATABASE_URL_SYNC: postgresql+psycopg://luciel_app:luciel_dev_pw@localhost:5432/luciel_dev
        run: |
          . .venv/bin/activate
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Lock audit log immutability (Architecture §5.3 / B1 — superuser post-migrate step)
        run: |
          # admin_audit_log is owned by luciel_audit_owner (a NOLOGIN role the app role
          # is not a member of) + an append-only guard trigger, so immutability is a true
          # lock, not a revocable grant. This runs as the postgres superuser after
          # migrations, exactly as the dev/prod ops step does.
          psql -h localhost -U postgres -d luciel_dev -v ON_ERROR_STOP=1 -f scripts/lock_audit_log.sql

      - name: Tenant-isolation suite (NON-OVERRIDABLE)
        env:
          LUCIEL_PG_HOST: localhost
        run: |
          . .venv/bin/activate
          python -m pytest tests/isolation -v

      - name: Unit + integration + contract suites
        env:
          LUCIEL_PG_HOST: localhost
          # The test currently running is in the log the moment it starts, so a hang
          # is attributable from the log alone (output was block-buffered before).
          PYTHONUNBUFFERED: "1"
        run: |
          . .venv/bin/activate
          python -m pytest tests/unit tests/integration tests/contract tests/migrations -v
