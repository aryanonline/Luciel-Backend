name: dependency-review

# Monthly dependency and CVE review (round 6 WP-B): what is outdated, what the
# image CVE gate is waiving and for how long, what the last image scan found, and a
# review issue a person can act on — without anyone having to remember to look.
# Also on demand.
#
# Round 7 WP-9 additions: pyproject range drift against uv.lock; the latest dev
# image's scan resolved per platform child through scripts/gate_image_scan.sh in
# report mode (the multi-arch TAG itself is never scanned); and Debian tracker
# status for every waived and every unallowlisted CVE, fetched by this runner
# because the monthly steward routine's sandbox cannot reach the tracker. Posted
# through scripts/post_review_issue.sh — the one "Dependency & CVE review YYYY-MM"
# title ci.yml's scheduled failures and image-rebuild.yml post to as well.
#
# Explicit `ref`: a scheduled run checks out the DEFAULT branch, which is the
# release branch now, but the ref is named so a later default-branch change can
# never point this at stale code.

on:
  schedule:
    # 02:00 UTC on the 1st: the monthly steward routine reads this issue at 13:00 UTC
    # the same day, and GitHub fires this repository's schedules 4-9 hours late
    # (the 2026-10-01 run started 14:09Z from a 07:00 cron - after the steward had
    # read the month's issue). The headroom keeps the drift and tracker sections
    # ahead of their reader (Phase 3 review, 2026-10-19).
    - cron: '0 2 1 * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  id-token: write

env:
  AWS_REGION: ca-central-1
  ECR_REPOSITORY: luciel-backend-dev

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/docs-conformance-build-20260713-r2

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Same pin as ci.yml and the Dockerfile (uv.lock was written by it).
          version: '0.12.23'

      - name: Set up Python
        run: uv python install 3.12

      - name: Install deps (the LOCKED set — what CI tests and the image ships)
        env:
          UV_PYTHON: '3.12'
        run: uv sync --frozen --extra dev

      - name: pip-audit (the same strict audit CI runs)
        id: audit
        continue-on-error: true
        run: |
          # pipefail: a `run:` with no `shell:` is `bash -e`, so without it this step's
          # outcome is tee's and the heading built from it says "success" over a failed
          # audit (run 41289873330 found 7 vulnerabilities and logged success; its post
          # step failed on the poster's gh flags, so that heading never reached an issue).
          set -o pipefail
          . .venv/bin/activate
          uv pip freeze --exclude-editable > /tmp/audit-reqs.txt
          pip-audit --strict --desc -r /tmp/audit-reqs.txt 2>&1 | tee audit.txt

      - name: pyproject range drift (uv.lock behind what its ranges allow)
        continue-on-error: true
        run: |
          # The lock pins what installs, so a lock nobody moves goes stale INSIDE its
          # ranges. uv re-resolves every range jointly and prints the moves an upgrade
          # would make WITHOUT writing the lock; lock_drift.py tables them (direct deps
          # with their range first). Advisory: never fails the job.
          uv lock --upgrade --dry-run > lock-upgrade.txt 2>&1 || true
          python3 scripts/lock_drift.py lock-upgrade.txt --markdown drift.md

      - name: Outdated Python packages (advisory)
        continue-on-error: true
        run: |
          . .venv/bin/activate
          uv pip list --outdated 2>&1 | tee outdated-python.txt || true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Outdated infra (CDK) packages (advisory)
        continue-on-error: true
        working-directory: infra
        run: |
          npm ci --no-audit --no-fund >/dev/null 2>&1 || true
          npm outdated 2>&1 | tee ../outdated-infra.txt || true

      - name: Image CVE waivers expiring within 35 days
        id: expiry
        continue-on-error: true
        run: python3 scripts/allowlist_expiry.py --within-days 35 --markdown expiry.md

      - name: Configure AWS credentials (OIDC, dev deploy role)
        id: aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::729005488042:role/luciel-dev-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      # The deploy pushes ONE tag that is a multi-arch index (round 7 WP-8); ECR scans
      # each platform child, never the index, so describe-image-scan-findings on the
      # TAG always answered ScanNotFoundException and this section was empty every
      # month. The gate script resolves the children exactly as the deploy does and
      # writes scan-findings-<os>-<arch>.json for each; here it runs in REPORT mode
      # (its verdict is shown, never enforced) and the counts come from those files.
      # Only TAGGED images are candidates: the platform children are untagged.
      - name: Latest dev image scan, per platform (ECR, report mode)
        id: scan
        if: steps.aws.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          tag=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
                  --query 'sort_by(imageDetails[?imageTags], &imagePushedAt)[-1].imageTags[0]' \
                  --output text 2>/dev/null)
          if [ -z "$tag" ] || [ "$tag" = "None" ]; then
            echo "no tagged image found in $ECR_REPOSITORY" | tee ecr.txt; exit 0
          fi
          echo "$tag" > ecr-tag.txt
          # Already-pushed images: their scans finished long ago, so a short wait.
          SCAN_WAIT_ATTEMPTS=3 bash scripts/gate_image_scan.sh "$ECR_REPOSITORY" "$tag" > gate.txt 2>&1
          echo "gate exit code: $?" >> gate.txt
          cat gate.txt
          python3 - <<'PY' | tee ecr.txt
          import glob
          import json

          ORDER = ["CRITICAL", "HIGH", "MEDIUM", "LOW", "INFORMATIONAL", "UNDEFINED"]
          paths = sorted(glob.glob("scan-findings-*.json"))
          if not paths:
              print("no platform child resolved - see the gate output below")
          for path in paths:
              platform = path[len("scan-findings-") : -len(".json")].replace("-", "/", 1)
              try:
                  with open(path, encoding="utf-8") as f:
                      data = json.load(f)
              except (OSError, ValueError) as exc:
                  print(f"{platform}: findings unreadable ({type(exc).__name__})")
                  continue
              status = (data.get("imageScanStatus") or {}).get("status") or "absent"
              counts = (data.get("imageScanFindings") or {}).get("findingSeverityCounts") or {}
              shown = ", ".join(f"{k} {counts[k]}" for k in ORDER if k in counts)
              print(f"{platform}: scan {status} - {shown or 'no findings'}")
          PY

      - name: Debian tracker status for every waived and every unallowlisted CVE
        continue-on-error: true
        run: |
          # The monthly steward routine cannot reach the tracker (egress-blocked in its
          # sandbox); this runner can. gate.txt is absent when AWS was unavailable —
          # the waivers are still looked up.
          python3 scripts/debian_tracker_status.py \
            --allowlist .security/cve-allowlist.json --gate-output gate.txt \
            --markdown tracker.md

      - name: Open or update the month's review issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          EXPIRY_OUTCOME: ${{ steps.expiry.outcome }}
        run: |
          set -euo pipefail
          {
            echo "Automated monthly review (\`dependency-review.yml\`, run ${{ github.run_id }})."
            echo
            echo "## pip-audit — **$AUDIT_OUTCOME**"
            echo '```'; tail -n 40 audit.txt 2>/dev/null || echo "(no output)"; echo '```'
            echo
            echo "## pyproject range drift (uv.lock behind the newest version its range allows)"
            cat drift.md 2>/dev/null || echo "(not computed)"
            echo
            echo "Dependabot's weekly \`uv\` PR closes this gap; a direct dependency listed here two months running means its PR is failing CI or waiting on a person."
            echo
            echo "## Image CVE waivers — **$EXPIRY_OUTCOME** (⚠️ = expires within 35 days)"
            cat expiry.md 2>/dev/null || echo "(no waivers file)"
            echo
            echo "## Latest dev image scan — \`$(cat ecr-tag.txt 2>/dev/null || echo '?')\` (severity counts per platform child)"
            echo '```'; cat ecr.txt 2>/dev/null || echo "(not read — AWS role unavailable to this run)"; echo '```'
            echo
            echo "<details><summary>Governed gate on that image, report mode (CRITICAL/HIGH; \`not allowlisted\` lines name package + installed version)</summary>"
            echo
            echo '```'; grep -v 'scan not ready' gate.txt 2>/dev/null || echo "(gate not run)"; echo '```'
            echo "</details>"
            echo
            cat tracker.md 2>/dev/null || echo "(Debian tracker status not gathered)"
            echo
            echo "## Newest on the index (advisory — includes versions OUTSIDE the ranges; a range bump is a person's call)"
            echo '```'; tail -n 60 outdated-python.txt 2>/dev/null || echo "(none)"; echo '```'
            echo '```'; tail -n 40 outdated-infra.txt 2>/dev/null || echo "(none)"; echo '```'
            echo
            echo "Minor/patch updates merge themselves once CI is green (Dependabot + auto-merge); majors carry the \`major-update\` label and need a person. Re-review waivers in \`.security/cve-allowlist.json\` before they expire — an expired one blocks the deploy."
          } > body.md
          # One title for every poster (ci.yml, image-rebuild.yml, this): the monthly
          # steward routine reads exactly "Dependency & CVE review YYYY-MM".
          bash scripts/post_review_issue.sh body.md
          [ "$AUDIT_OUTCOME" = "success" ] && [ "$EXPIRY_OUTCOME" = "success" ]
