name: deploy

# CD pipeline (DEVOPS §5.8). Two STANDING environments (dev + prod) plus an
# EPHEMERAL, prod-shaped `preprod` that is stood up on every prod release to run
# the §10 verification harness as a HARD gate, then is ALWAYS torn down (cdk
# destroy; ephemeral RDS deleted with NO final snapshot). preprod must NEVER be
# left running (cost).
#
# Build+scan image -> push ECR (CVE gate) -> migrate with the NEW image as a one-off
# ECS task INSIDE the VPC (RDS is private), BEFORE the services roll -> deploy stacks
# via the OIDC deploy role (no static keys; INFRA-SEC-01 fix) -> a no-op post-roll
# migration, the smoke probe, the §10 verify task (and on dev the strict D10 SeedTest
# gate), rolling the SERVICES back if any of those fail. Every hostname comes from
# infra/bin/hostnames.ts (owner decision D6). The image is MULTI-ARCH (buildx, linux/amd64 +
# linux/arm64 under one tag) because every backend task definition runs on
# Graviton (round 7 WP-8, D7); scripts/gate_image_scan.sh gates each platform child.
#
# Triggers (dispatch only — there is no push trigger: `main` is a stale revert and
# the `guard` job refuses any ref but the release branch):
#   - workflow_dispatch dev  -> manual dev deploy. Always pass
#     `--ref feat/docs-conformance-build-20260713-r2`; a bare dispatch uses the
#     default branch, which is now the release branch too.
#   - workflow_dispatch prod -> prod RELEASE FLOW (below). Gated by the GitHub
#     `prod` Environment protection rule AND by the preprod §10 harness: prod is
#     NEVER reached unless a prod-shaped preprod passed the §10 verification.
#
# Prod release flow (all automatic once approved):
#   preprod-standup (build+scan+GATE the release image into the prod ECR repo,
#   cdk deploy preprod -c imageTag=<sha> + integrationMode=live, migrate)
#   -> preprod-verify (run-verify-task.sh + run-seedtest-task.sh, HARD gate)
#   -> prod-deploy (reuses the SAME gated artifact; only if verify passed)
#   -> preprod-teardown (if: always(), cdk destroy preprod --force; can't be skipped).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, prod]
        default: dev
      integration_mode:
        # Empty means the DEV_INTEGRATION_MODE repo variable (live on dev): a dispatch
        # that omits the input can no longer flip a live environment back to mock.
        description: LLM integration mode (GATE 2). 'live' enables real Anthropic/OpenAI. Empty = repo variable DEV_INTEGRATION_MODE.
        type: choice
        options: ['', mock, live]
        default: ''
      paused:
        # The cheap-idle switch has existed in the CDK app since it was written
        # (`-c paused=true` -> every ECS service desiredCount 0, every sweep schedule
        # DISABLED) but NOTHING in the pipeline ever passed it, so the one deliberate
        # cost lever could only be pulled by hand from a laptop with deploy creds.
        # Exposed here so pausing and resuming an environment is a repeatable,
        # audited pipeline action like any other deploy. Resume = run again with false.
        description: Pause the environment (all services to 0, sweeps disabled). Resume with false.
        type: choice
        options: ['false', 'true']
        default: 'false'

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  AWS_REGION: ca-central-1
  ACCOUNT: '729005488042'

jobs:
  # ---- GUARD: deploys run ONLY from the release branch --------------------------
  # `main` is a stale revert (CLAUDE.md "Branch discipline"), yet a bare
  # `gh workflow run` dispatches the repository's default branch and every job
  # below checks out whatever ref was dispatched. 2026-09-06: a dispatch without
  # `--ref` deployed main to dev for 25 minutes. The default branch now IS the
  # release branch, and this job refuses anything else before a single AWS call.
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse any ref that is not the release branch
        env:
          RELEASE_BRANCH: ${{ vars.RELEASE_BRANCH || 'feat/docs-conformance-build-20260713-r2' }}
        run: |
          if [ "${{ github.ref_name }}" != "$RELEASE_BRANCH" ]; then
            echo "::error::deploys run only from $RELEASE_BRANCH (dispatched ref: ${{ github.ref_name }}). Re-run with --ref $RELEASE_BRANCH."
            exit 1
          fi
          echo "ref ${{ github.ref_name }} is the release branch"

  # ---- DEV: manual dispatch with environment=dev -------------------------------
  dev:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'dev'
    needs: guard
    runs-on: ubuntu-latest
    environment: dev
    env:
      ENVIRONMENT: dev
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::729005488042:role/luciel-dev-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Skipped on a pause run: pausing takes the environment DOWN, so it must never
      # be blocked by a build or a red CVE gate (that inversion actually happened —
      # a critical-CVE day made the environment impossible to pause).
      # buildx + QEMU: the arm64 half of the multi-arch image is cross-built on
      # the amd64 runner (round 7 WP-8, D7 Graviton). See the build step below.
      - uses: docker/setup-qemu-action@v3
        if: inputs.paused != 'true'
      - uses: docker/setup-buildx-action@v3
        if: inputs.paused != 'true'

      - name: Build, scan, push image
        if: inputs.paused != 'true'
        env:
          ECR: ${{ steps.ecr.outputs.registry }}
          REPO: luciel-backend-dev
          TAG: ${{ github.sha }}
        run: |
          # Idempotent: if this commit's image is already in ECR (e.g. a re-run of
          # the same SHA against an IMMUTABLE repo), skip build/push and reuse it.
          # The gate below still checks that the existing tag is a multi-arch index:
          # an amd64-only image from before the Graviton move fails closed instead
          # of deploying a task ECS can never start on ARM64.
          if aws ecr describe-images --repository-name "$REPO" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "Image $TAG already present - skipping build/push, reusing it."
          else
            # ONE tag, TWO platforms (round 7 WP-8, D7 Graviton): buildx + QEMU build
            # linux/amd64 and linux/arm64 and push them under an OCI image index, so
            # the ARM64 task definitions and any amd64 consumer (local docker run, an
            # x86 fallback) pull the same gated tag. --provenance/--sbom off: buildx
            # would otherwise add attestation manifests (platform unknown/unknown)
            # to the index, which ECR lists as phantom images.
            docker buildx build --platform linux/amd64,linux/arm64 \
              --provenance=false --sbom=false \
              -t "$ECR/$REPO:$TAG" --push .
          fi
          # Governed CVE gate (scripts/gate_image_scan.sh -> check_image_scan.py):
          # resolves the tag's platform children and gates EACH one — the index
          # itself is not an image ECR can scan. Fails CLOSED on scan unavailability,
          # on any non-allowlisted CRITICAL/HIGH, on expired allowlist entries, and
          # on a tag that is not a multi-arch index.
          bash scripts/gate_image_scan.sh "$REPO" "$TAG"
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"

      # A pause run deploys no new code, so it reuses the image the environment is
      # ALREADY running (read from the live service's task definition) rather than
      # minting an ungated tag.
      - name: Resolve the currently deployed image tag (pause runs only)
        if: inputs.paused == 'true'
        run: |
          # Newest tag in the env's IMMUTABLE repo - every deploy pushes before it
          # deploys, so this is the running (or most recently gated) artifact. Read
          # from ECR rather than the ECS task definition because the deploy role
          # holds ecr:DescribeImages (the build step's idempotency check depends on
          # it) but not ecs:DescribeTaskDefinition - and a pause should not need
          # wider IAM than a deploy.
          TAG=$(aws ecr describe-images --repository-name luciel-backend-dev --query 'sort_by(imageDetails,&imagePushedAt)[-1].imageTags[0]' --output text)
          echo "[pause] reusing gated image tag $TAG"
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      # Round 7 WP-8b (owner decision D6): every hostname this job touches comes from
      # infra's hostnames helper (env-config.ts `hostnames`) — dev answers on
      # api-dev.vantagemind.ai (plus the public names while it owns them), and a
      # literal public hostname here would probe whichever environment owns it.
      - name: Install infra dependencies + resolve the environment's hostnames
        id: hosts
        working-directory: infra
        run: |
          npm ci
          api_base=$(npx ts-node --prefer-ts-exts bin/hostnames.ts dev apiBaseUrl)
          echo "api_base=$api_base" >> "$GITHUB_OUTPUT"
          echo "[hosts] dev API origin: $api_base"
          npx ts-node --prefer-ts-exts bin/hostnames.ts dev

      # The deploy role's own grants land BEFORE the steps that use them. The
      # migrate-before-roll step below needs ecs:RegisterTaskDefinition et al.
      # (PipelineStack MigrateBeforeRoll); deployed only in the main deploy, a new
      # grant would arrive one run too late. A no-op when nothing changed.
      - name: Apply the deploy role's grants first (Pipeline stack)
        if: inputs.paused != 'true'
        working-directory: infra
        run: |
          npx cdk deploy "Luciel-dev-Pipeline" --exclusively \
            -c env=dev -c imageTag=$IMAGE_TAG \
            -c budgetAlertEmail=${{ vars.BUDGET_ALERT_EMAIL || '' }} \
            --require-approval never

      # 2026-09-05 audit F008: remember what is serving BEFORE the deploy so a failed
      # smoke probe below can put it back. First deploy of an environment has nothing
      # to remember (had_previous=false) and simply skips the rollback.
      - name: Record the running task definitions (rollback target)
        id: previous
        if: inputs.paused != 'true'
        run: |
          cluster=$(aws cloudformation list-exports --query "Exports[?Name=='Luciel-dev-ClusterName'].Value" --output text)
          if [ -z "$cluster" ] || [ "$cluster" = "None" ]; then
            echo "[rollback] no cluster yet - first deploy, nothing to record"
            echo "had_previous=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          services=$(aws ecs list-services --cluster "$cluster" --query 'serviceArns' --output text)
          aws ecs describe-services --cluster "$cluster" --services $services \
            --query 'services[].{name:serviceName,td:taskDefinition}' --output json > previous-services.json
          cat previous-services.json
          echo "cluster=$cluster" >> "$GITHUB_OUTPUT"
          echo "had_previous=true" >> "$GITHUB_OUTPUT"

      # Round 7 migrations review (2026-10-11): migrate with the NEW image BEFORE the
      # Compute stack rolls the services. The MigrationTask definition lives in that
      # stack and carries the image, so the only migration used to run AFTER the
      # roll — a refused migration (0067 refuses on duplicate claims by design) left
      # the NEW code serving the OLD schema until the rollback. The script registers a
      # revision of the current MigrationTask with the gated image, runs it, and
      # deregisters it; a refusal now stops the job while the old code still serves
      # the old schema, so there is nothing to roll back. Migrations stay expand-first:
      # for the length of the roll the OLD code runs on the NEW schema.
      - name: Migrate with the NEW image before the services roll
        id: migrate_preroll
        if: inputs.paused != 'true'
        env:
          ECR: ${{ steps.ecr.outputs.registry }}
        run: bash scripts/migrate-before-roll.sh dev "$ECR/luciel-backend-dev:$IMAGE_TAG"

      - name: Deploy infra stacks (Networking/Data/Compute/Edge/Observability/Budget/Widget)
        working-directory: infra
        run: |
          # npm ci ran in the hostnames step above.
          # WidgetCert lives in us-east-1 and Widget (ca-central-1) consumes it via
          # crossRegionReferences; the CDK app wires that, so naming both is enough.
          # Networking is named so VPC-shape changes (e.g. the env-gated interface
          # endpoints) actually apply — it no-ops when unchanged.
          # Data is named because it owns the transcript-archive bucket the Compute
          # task role is granted on (Commitment #38) — deploying Compute against a
          # stale Data stack fails on a cross-stack export that does not exist yet.
          # Budget is the per-environment AWS Budgets ceiling: no runtime cost, and
          # it is the control that catches an environment left running by accident.
          # Pipeline holds the GitHub deploy role: deploying it here is what lets a
          # grant change (2026-09-05: RollbackAppServices) reach the role that uses it.
          # imageTag points Compute at the SCANNED artifact in ECR — the gate above
          # gated the exact bytes ECS will run, not a parallel rebuild.
          npx cdk deploy "Luciel-dev-Networking" "Luciel-dev-Data" "Luciel-dev-Compute" \
            "Luciel-dev-Edge" "Luciel-dev-Observability" "Luciel-dev-Budget" \
            "Luciel-dev-WidgetCert" "Luciel-dev-Widget" "Luciel-dev-Web" "Luciel-dev-Pipeline" \
            "Luciel-dev-Dns" \
            -c env=dev -c imageTag=$IMAGE_TAG \
            -c integrationMode=${{ inputs.integration_mode || vars.DEV_INTEGRATION_MODE || 'mock' }} \
            -c paused=${{ inputs.paused || 'false' }} \
            -c budgetAlertEmail=${{ vars.BUDGET_ALERT_EMAIL || '' }} \
            --require-approval never

      # Skipped when pausing: a pause run is taking the environment DOWN, so there is
      # nothing to migrate and a migration task would be the only thing still running.
      # The schema already moved in the migrate-before-roll step; this run of the
      # stack's own (now new-image) MigrationTask is a no-op safety (alembic is
      # idempotent) that also covers the first deploy of an environment, where there
      # was no MigrationTask to migrate with beforehand. A failure here still rolls the
      # services back below.
      - name: Re-run DB migrations after the roll (no-op safety; alembic is idempotent)
        id: migrate
        if: inputs.paused != 'true'
        run: bash scripts/run-migration-task.sh dev

      # 2026-09-05 audit F008: the deploy is not done until the live API answers the
      # way it was deployed to — healthz live with no degraded binding, both planes
      # reachable through the ALB (F067) — and the §10 probe passes as luciel_app.
      # The probe resolves dev's OWN api origin (and Stripe posture) from the hostnames
      # helper (round 7 WP-8b) — never the public host, which is the apex owner's.
      - name: Post-deploy smoke probe (healthz + both planes answer)
        id: smoke
        if: inputs.paused != 'true'
        run: bash scripts/smoke_probe.sh dev ${{ inputs.integration_mode || vars.DEV_INTEGRATION_MODE || 'mock' }}

      - name: §10 live probe as luciel_app (one-off ECS task inside the VPC)
        id: verify
        if: inputs.paused != 'true'
        run: bash scripts/run-verify-task.sh dev

      # Owner decision D10: the SeedTest live-behavior harness runs after EVERY dev
      # deploy and fails the workflow on a non-zero exit — STRICT, so a skipped T-case
      # is a failure unless the skip is an allowed kind (an opt-in case nobody opted
      # into). A failure rolls the services back like the probes above. The harness
      # proves LIVE behavior (a real grounded answer, the live fallback), so a mock
      # deploy has nothing for it to prove: the next step says so out loud instead.
      - name: D10 — SeedTest live-behavior gate (strict)
        id: seedtest
        if: inputs.paused != 'true' && (inputs.integration_mode || vars.DEV_INTEGRATION_MODE || 'mock') == 'live'
        run: bash scripts/run-seedtest-task.sh dev --strict

      - name: D10 — a mock deploy has no live behavior to gate (said, not skipped silently)
        if: inputs.paused != 'true' && (inputs.integration_mode || vars.DEV_INTEGRATION_MODE || 'mock') != 'live'
        run: echo "::notice::D10 SeedTest gate not run — this deploy is integration_mode=mock; the harness proves LIVE behavior (it would fail T1 by design). Deploy with integration_mode=live to gate on it."

      # Restores SERVICES only: the schema moved before the roll (migrate-before-roll)
      # and every migration is expand-first, so the previous task definitions run on
      # it. A pre-roll migration failure never reaches here — the job stops before
      # the Compute stack rolls anything.
      - name: Roll the app services back to the previous task definitions
        if: failure() && steps.previous.outputs.had_previous == 'true' && (steps.migrate.outcome == 'failure' || steps.smoke.outcome == 'failure' || steps.verify.outcome == 'failure' || steps.seedtest.outcome == 'failure')
        run: |
          cluster='${{ steps.previous.outputs.cluster }}'
          python3 - "$cluster" <<'PY'
          import json, subprocess, sys
          cluster = sys.argv[1]
          for svc in json.load(open('previous-services.json')):
              print(f"[rollback] {svc['name']} -> {svc['td']}", flush=True)
              subprocess.run(['aws', 'ecs', 'update-service', '--cluster', cluster, '--service', svc['name'],
                              '--task-definition', svc['td'], '--force-new-deployment',
                              '--query', 'service.deployments[0].status', '--output', 'text'], check=True)
          PY
          echo "::error::the post-deploy migration, a post-deploy probe or the D10 SeedTest gate failed; app services rolled back to the previous task definitions (the schema stays where the migration left it — expand-first)"
          exit 1

  # ---- PROD RELEASE: stand up ephemeral prod-shaped preprod -> §10 HARD gate ----
  # ---- -> prod -> always teardown. Manual dispatch + environment=prod only. ------

  # 1) Stand up the EPHEMERAL prod-shaped preprod (full stack set), live LLM mode,
  #    and migrate it. The `prod` environment gate (manual approval) applies here so
  #    the whole release flow is held until a human approves.
  preprod-standup:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'
    needs: guard
    runs-on: ubuntu-latest
    environment: prod
    env:
      ENVIRONMENT: preprod
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS via OIDC (preprod deploy role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Ephemeral preprod is part of the prod release, so it uses the DURABLE
          # prod deploy role (created once by the prod PipelineStack). A per-preprod
          # role can't exist before preprod is stood up (chicken-and-egg).
          role-to-assume: arn:aws:iam::729005488042:role/luciel-prod-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      # Owner decision D6: prod's names ARE the public names, and exactly one
      # environment may own them (env-config.ts ownsPublicApex; dev until the cutover).
      # A prod deploy while dev still owns them would collide with dev's records and
      # CloudFront alias — and the prod smoke probe would be answered by DEV's API, a
      # green check proving the wrong environment. Refused here, before a preprod is
      # stood up for a release that cannot land. Cutover: flip dev's and prod's flags
      # in one commit, deploy DEV first (it releases the names), then release prod.
      - name: Refuse a prod release while prod does not own the public names (D6)
        working-directory: infra
        run: |
          npm ci
          if [ "$(npx ts-node --prefer-ts-exts bin/hostnames.ts prod servesUnownedPublicNames)" != "false" ]; then
            echo "::error::prod's hostnames are the public names but env-config.ts gives ownsPublicApex to another environment — flip both flags in one commit and deploy dev first (D6 cutover)."
            exit 1
          fi
          npx ts-node --prefer-ts-exts bin/hostnames.ts prod
          npx ts-node --prefer-ts-exts bin/hostnames.ts preprod

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Preprod used to deploy a CDK-asset image with NO scan of any kind — the one
      # environment whose whole purpose is to rehearse prod ran ungated bytes. It now
      # builds/scans/gates into the PROD repo under this commit's SHA, so the §10
      # rehearsal exercises the exact artifact prod will deploy.
      # buildx + QEMU: the arm64 half of the multi-arch image is cross-built on
      # the amd64 runner (round 7 WP-8, D7 Graviton). See the build step below.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build, scan, push image (prod repo — the release artifact)
        env:
          ECR: ${{ steps.ecr.outputs.registry }}
          REPO: luciel-backend-prod
          TAG: ${{ github.sha }}
        run: |
          # Idempotent: if this commit's image is already in ECR (e.g. a re-run of
          # the same SHA against an IMMUTABLE repo), skip build/push and reuse it.
          # The gate below still checks that the existing tag is a multi-arch index:
          # an amd64-only image from before the Graviton move fails closed instead
          # of deploying a task ECS can never start on ARM64.
          if aws ecr describe-images --repository-name "$REPO" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "Image $TAG already present - skipping build/push, reusing it."
          else
            # ONE tag, TWO platforms (round 7 WP-8, D7 Graviton): buildx + QEMU build
            # linux/amd64 and linux/arm64 and push them under an OCI image index, so
            # the ARM64 task definitions and any amd64 consumer (local docker run, an
            # x86 fallback) pull the same gated tag. --provenance/--sbom off: buildx
            # would otherwise add attestation manifests (platform unknown/unknown)
            # to the index, which ECR lists as phantom images.
            docker buildx build --platform linux/amd64,linux/arm64 \
              --provenance=false --sbom=false \
              -t "$ECR/$REPO:$TAG" --push .
          fi
          # Governed CVE gate (scripts/gate_image_scan.sh -> check_image_scan.py):
          # resolves the tag's platform children and gates EACH one — the index
          # itself is not an image ECR can scan. Fails CLOSED on scan unavailability,
          # on any non-allowlisted CRITICAL/HIGH, on expired allowlist entries, and
          # on a tag that is not a multi-arch index.
          bash scripts/gate_image_scan.sh "$REPO" "$TAG"

      - name: Stand up preprod (prod-shaped, gated image + live LLM)
        working-directory: infra
        run: |
          # npm ci ran in the D6 ownership check above. Preprod answers on its OWN
          # names (preprod. / api-preprod. / embed-preprod.<apex>, round 7
          # WP-8b): it used to claim the public api name, which dev's records held.
          # Full stack set: preprod is created from scratch each release. imageTag
          # points at the gated release artifact in the PROD repo (imageRepoName in
          # env-config.ts); integrationMode=live exercises real Anthropic/OpenAI for
          # a faithful §10 production rehearsal.
          npx cdk deploy "Luciel-preprod-*" \
            -c env=preprod -c imageTag=${{ github.sha }} -c integrationMode=live \
            --require-approval never

      - name: Run DB migrations on preprod (one-off ECS task, inside the VPC)
        run: bash scripts/run-migration-task.sh preprod

  # 2) §10 verification harness against preprod. HARD gate: any non-zero exit fails
  #    this job, which (via `needs`) prevents prod-deploy from running.
  preprod-verify:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'
    needs: [guard, preprod-standup]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS via OIDC (preprod deploy role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::729005488042:role/luciel-prod-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: §10 HARD gate — verify + seedtest against preprod
        run: |
          # Either probe exiting non-zero fails the job (set -e). Because prod-deploy
          # `needs` this job, a failure here BLOCKS the prod deploy. Teardown still
          # runs (if: always()). run-seedtest-task.sh runs the harness --strict by
          # default (round 7 WP-12): a case that skipped outside the owner-gated
          # allowlist fails this gate instead of reading as PASS. Never add
          # --no-strict here. The harness's closing one-line SUMMARY (and every
          # [FAIL]/[SKIP]) lands in this job's summary via $GITHUB_STEP_SUMMARY.
          set -e
          bash scripts/run-verify-task.sh preprod
          bash scripts/run-seedtest-task.sh preprod --strict
          echo "[gate] preprod §10 verification PASSED — prod deploy unblocked."

  # 3) Deploy prod — ONLY runs if preprod-verify succeeded (default `needs` gating).
  prod-deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'
    needs: [guard, preprod-standup, preprod-verify]
    runs-on: ubuntu-latest
    environment: prod
    env:
      ENVIRONMENT: prod
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS via OIDC (prod deploy role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::729005488042:role/luciel-prod-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # By this point preprod-standup already built, scanned, and GATED this exact
      # tag (immutable repo, same SHA) and the §10 harness verified the environment
      # running it — so prod reuses the artifact and this step is normally the
      # idempotent-skip path. The gate still re-runs: an allowlist entry can expire
      # between rehearsal and release.
      # buildx + QEMU: the arm64 half of the multi-arch image is cross-built on
      # the amd64 runner (round 7 WP-8, D7 Graviton). See the build step below.
      - uses: docker/setup-qemu-action@v3
        if: inputs.paused != 'true'
      - uses: docker/setup-buildx-action@v3
        if: inputs.paused != 'true'

      - name: Build, scan, push image
        if: inputs.paused != 'true'
        env:
          ECR: ${{ steps.ecr.outputs.registry }}
          REPO: luciel-backend-prod
          TAG: ${{ github.sha }}
        run: |
          # Idempotent: if this commit's image is already in ECR (e.g. a re-run of
          # the same SHA against an IMMUTABLE repo), skip build/push and reuse it.
          # The gate below still checks that the existing tag is a multi-arch index:
          # an amd64-only image from before the Graviton move fails closed instead
          # of deploying a task ECS can never start on ARM64.
          if aws ecr describe-images --repository-name "$REPO" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "Image $TAG already present - skipping build/push, reusing it."
          else
            # ONE tag, TWO platforms (round 7 WP-8, D7 Graviton): buildx + QEMU build
            # linux/amd64 and linux/arm64 and push them under an OCI image index, so
            # the ARM64 task definitions and any amd64 consumer (local docker run, an
            # x86 fallback) pull the same gated tag. --provenance/--sbom off: buildx
            # would otherwise add attestation manifests (platform unknown/unknown)
            # to the index, which ECR lists as phantom images.
            docker buildx build --platform linux/amd64,linux/arm64 \
              --provenance=false --sbom=false \
              -t "$ECR/$REPO:$TAG" --push .
          fi
          # Governed CVE gate (scripts/gate_image_scan.sh -> check_image_scan.py):
          # resolves the tag's platform children and gates EACH one — the index
          # itself is not an image ECR can scan. Fails CLOSED on scan unavailability,
          # on any non-allowlisted CRITICAL/HIGH, on expired allowlist entries, and
          # on a tag that is not a multi-arch index.
          bash scripts/gate_image_scan.sh "$REPO" "$TAG"
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Resolve the currently deployed image tag (pause runs only)
        if: inputs.paused == 'true'
        run: |
          # Newest tag in the env's IMMUTABLE repo - every deploy pushes before it
          # deploys, so this is the running (or most recently gated) artifact. Read
          # from ECR rather than the ECS task definition because the deploy role
          # holds ecr:DescribeImages (the build step's idempotency check depends on
          # it) but not ecs:DescribeTaskDefinition - and a pause should not need
          # wider IAM than a deploy.
          TAG=$(aws ecr describe-images --repository-name luciel-backend-prod --query 'sort_by(imageDetails,&imagePushedAt)[-1].imageTags[0]' --output text)
          echo "[pause] reusing gated image tag $TAG"
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      # Same D6 refusal as preprod-standup (defense in depth: this job is what would
      # write the public records), and prod's hostnames for the log.
      - name: Install infra dependencies + refuse unless prod owns the public names (D6)
        id: hosts
        working-directory: infra
        run: |
          npm ci
          if [ "$(npx ts-node --prefer-ts-exts bin/hostnames.ts prod servesUnownedPublicNames)" != "false" ]; then
            echo "::error::prod does not own the public names yet (env-config.ts ownsPublicApex) — D6 cutover first."
            exit 1
          fi
          api_base=$(npx ts-node --prefer-ts-exts bin/hostnames.ts prod apiBaseUrl)
          echo "api_base=$api_base" >> "$GITHUB_OUTPUT"
          npx ts-node --prefer-ts-exts bin/hostnames.ts prod

      # Round 7 migrations review: the prod job now has the dev job's whole shape —
      # deploy-role grants first, record the serving task definitions, migrate with the
      # NEW image BEFORE the roll, deploy, a no-op post-roll migration, the smoke probe
      # and the §10 verify task against prod, and a rollback of the SERVICES when any
      # post-roll step fails. Before this a refused migration left prod serving the new
      # image against the old schema with no automatic way back.
      - name: Apply the deploy role's grants first (Pipeline stack)
        if: inputs.paused != 'true'
        working-directory: infra
        run: |
          npx cdk deploy "Luciel-prod-Pipeline" --exclusively \
            -c env=prod -c imageTag=$IMAGE_TAG \
            -c budgetAlertEmail=${{ vars.BUDGET_ALERT_EMAIL || '' }} \
            --require-approval never

      - name: Record the running task definitions (rollback target)
        id: previous
        if: inputs.paused != 'true'
        run: |
          cluster=$(aws cloudformation list-exports --query "Exports[?Name=='Luciel-prod-ClusterName'].Value" --output text)
          if [ -z "$cluster" ] || [ "$cluster" = "None" ]; then
            echo "[rollback] no cluster yet - first deploy, nothing to record"
            echo "had_previous=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          services=$(aws ecs list-services --cluster "$cluster" --query 'serviceArns' --output text)
          aws ecs describe-services --cluster "$cluster" --services $services \
            --query 'services[].{name:serviceName,td:taskDefinition}' --output json > previous-services.json
          cat previous-services.json
          echo "cluster=$cluster" >> "$GITHUB_OUTPUT"
          echo "had_previous=true" >> "$GITHUB_OUTPUT"

      - name: Migrate with the NEW image before the services roll
        id: migrate_preroll
        if: inputs.paused != 'true'
        env:
          ECR: ${{ steps.ecr.outputs.registry }}
        run: bash scripts/migrate-before-roll.sh prod "$ECR/luciel-backend-prod:$IMAGE_TAG"

      - name: Deploy prod infra stacks (Networking/Data/Compute/Edge/Observability/Budget/Widget)
        working-directory: infra
        run: |
          # npm ci ran in the hostnames step above.
          # Networking/Data/Budget are named for the same reasons as in the dev job:
          # VPC-shape changes must apply, the transcript-archive bucket's cross-stack
          # export, and the cost ceiling. Dns publishes the hostnames (and deploys after
          # Compute/Web on purpose — see bin/luciel-infra.ts).
          npx cdk deploy "Luciel-prod-Networking" "Luciel-prod-Data" "Luciel-prod-Compute" \
            "Luciel-prod-Edge" "Luciel-prod-Observability" "Luciel-prod-Budget" \
            "Luciel-prod-WidgetCert" "Luciel-prod-Widget" "Luciel-prod-Web" \
            "Luciel-prod-Dns" \
            -c env=prod -c imageTag=$IMAGE_TAG \
            -c integrationMode=${{ inputs.integration_mode || 'live' }} \
            -c paused=${{ inputs.paused || 'false' }} \
            -c budgetAlertEmail=${{ vars.BUDGET_ALERT_EMAIL || '' }} \
            --require-approval never

      # See the dev job: a pause run takes the environment down, so there is nothing
      # to migrate; otherwise this is the no-op safety after the pre-roll migration.
      - name: Re-run DB migrations after the roll (no-op safety; alembic is idempotent)
        id: migrate
        if: inputs.paused != 'true'
        run: bash scripts/run-migration-task.sh prod

      # Prod's api origin and Stripe posture (mock — prod stays mock until the
      # owner-gated cutover) come from the hostnames helper, like dev's.
      - name: Post-deploy smoke probe (healthz + both planes answer)
        id: smoke
        if: inputs.paused != 'true'
        run: bash scripts/smoke_probe.sh prod ${{ inputs.integration_mode || 'live' }}

      - name: §10 live probe as luciel_app (one-off ECS task inside the VPC)
        id: verify
        if: inputs.paused != 'true'
        run: bash scripts/run-verify-task.sh prod

      - name: Roll the app services back to the previous task definitions
        if: failure() && steps.previous.outputs.had_previous == 'true' && (steps.migrate.outcome == 'failure' || steps.smoke.outcome == 'failure' || steps.verify.outcome == 'failure')
        run: |
          cluster='${{ steps.previous.outputs.cluster }}'
          python3 - "$cluster" <<'PY'
          import json, subprocess, sys
          cluster = sys.argv[1]
          for svc in json.load(open('previous-services.json')):
              print(f"[rollback] {svc['name']} -> {svc['td']}", flush=True)
              subprocess.run(['aws', 'ecs', 'update-service', '--cluster', cluster, '--service', svc['name'],
                              '--task-definition', svc['td'], '--force-new-deployment',
                              '--query', 'service.deployments[0].status', '--output', 'text'], check=True)
          PY
          echo "::error::the post-deploy migration or a post-deploy probe failed; prod app services rolled back to the previous task definitions (the schema stays where the migration left it — expand-first)"
          exit 1

  # 4) ALWAYS tear down preprod — even if standup/verify/prod-deploy failed. The
  #    ephemeral RDS is deleted WITHOUT a final snapshot (removalPolicy DESTROY +
  #    deletionProtection false for non-prod envs). preprod must never be left
  #    running for cost reasons; this job cannot be skipped.
  preprod-teardown:
    if: always() && github.event_name == 'workflow_dispatch' && inputs.environment == 'prod' && needs.guard.result == 'success'
    needs: [guard, preprod-standup, preprod-verify, prod-deploy]
    runs-on: ubuntu-latest
    environment: prod
    env:
      ENVIRONMENT: preprod
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS via OIDC (preprod deploy role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::729005488042:role/luciel-prod-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Tear down ephemeral preprod (cdk destroy --force, no final snapshot)
        working-directory: infra
        run: |
          npm ci
          echo "[teardown] destroying ephemeral preprod — it must NEVER be left running (cost)."
          # --force = non-interactive. preprod RDS uses removalPolicy DESTROY with
          # deletionProtection disabled (non-prod), so it is deleted with NO final
          # snapshot (ephemeral test data).
          npx cdk destroy "Luciel-preprod-*" -c env=preprod --force

      - name: Confirm preprod is gone
        run: |
          set -e
          # EVERY status except DELETE_COMPLETE (round 7 WP-8). The old filter named
          # four SUCCESS states, so a stack stuck in DELETE_FAILED, ROLLBACK_FAILED
          # or UPDATE_ROLLBACK_FAILED — exactly what a failed teardown leaves behind,
          # burning prod-shaped cost — matched nothing and the job passed green.
          # list-stacks keeps DELETE_COMPLETE summaries for 90 days, hence the one
          # exclusion; the status is printed with the name so the failure says why.
          LEFT=$(aws cloudformation list-stacks --region "$AWS_REGION" \
            --query "StackSummaries[?starts_with(StackName, 'Luciel-preprod-') && StackStatus != 'DELETE_COMPLETE'].join(' ', [StackName, StackStatus])" --output text)
          if [ -n "$LEFT" ] && [ "$LEFT" != "None" ]; then
            echo "::error::preprod stacks still present after teardown: $LEFT"; exit 1
          fi
          echo "[teardown] preprod fully torn down."
